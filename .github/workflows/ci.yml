name: SDK validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: '20'
            python: '3.10'
          - node: '22'
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/sync_shared.py --check
      - run: npm ci
      - run: npm test
      - run: npm run test:examples
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e 'packages/python[dev]'
      - run: .venv/bin/pytest packages/python/tests tests examples/test_custom_filter.py
      - run: npm run test:parity
      - run: .venv/bin/ruff check packages/python scripts tests
      - run: mkdir -p dist && npm pack -w jev-moderation --pack-destination dist
      - run: .venv/bin/python -m build packages/python --outdir dist
