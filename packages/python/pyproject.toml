[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-moderation"
version = "0.1.0"
description = "Configurable Jev message moderation and evaluation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.7.1,<0.8", "jsonschema>=4.20,<5", "typing-extensions>=4.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1", "ruff>=0.9"]

[project.scripts]
jev-moderation = "jev_moderation.cli:main"

[tool.setuptools.package-data]
jev_moderation = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
