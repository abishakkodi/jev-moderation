[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-moderation"
version = "0.1.0"
description = "Configurable Jev message moderation and evaluation tools"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3"]
dependencies = ["typesafe-sdk>=0.7.1,<0.8", "jsonschema>=4.20,<5", "typing-extensions>=4.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1", "ruff>=0.9", "twine>=6", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/abishakkodi/jev-moderation"
Repository = "https://github.com/abishakkodi/jev-moderation"
Issues = "https://github.com/abishakkodi/jev-moderation/issues"

[project.scripts]
jev-moderation = "jev_moderation.cli:main"

[tool.setuptools.package-data]
jev_moderation = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
